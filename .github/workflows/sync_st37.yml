name: AER ST37 Automated Sync & Delta Pipeline

on:
  schedule:
    # Run daily at 13:15 UTC (7:15 AM Alberta Mountain Time)
    - cron: '15 13 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force full database rebuild and delta generation'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Data Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install pandas openpyxl requests

      - name: Probe AER for Monthly Release
        id: probe
        run: |
          set +e
          python scripts/probe_st37.py
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "AER ST37 update detected!"
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No update from AER today."
          else
            echo "Probe exited with unexpected error code: $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Process ST37 Update & Generate Delta
        if: steps.probe.outputs.changed == 'true' || inputs.force_build == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/st37_work
          echo "Building new SQLite database from AER ST37 Excel..."
          python scripts/build_wells_db.py \
            --remote \
            --output-db /tmp/st37_work/wellpad_wells_new.db

          # Count wells
          WELL_COUNT=$(python -c "import sqlite3; con=sqlite3.connect('/tmp/st37_work/wellpad_wells_new.db'); print(con.execute('SELECT COUNT(*) FROM lease_wells').fetchone()[0])")
          echo "Total wells indexed: ${WELL_COUNT}"

          # Compress new database
          gzip -c -9 /tmp/st37_work/wellpad_wells_new.db > /tmp/st37_work/wellpad_wells.db.gzip

          # Download previous baseline release asset to compute micro-delta
          echo "Attempting to download previous baseline database from GitHub Releases..."
          gh release download --pattern "wellpad_wells.db.gzip" --repo caddie23/wellpad-data --dir /tmp/st37_work/old_release/ || true

          if [ -f "/tmp/st37_work/old_release/wellpad_wells.db.gzip" ]; then
            echo "Extracting previous baseline database for delta calculation..."
            gunzip -c /tmp/st37_work/old_release/wellpad_wells.db.gzip > /tmp/st37_work/wellpad_wells_old.db
            python scripts/generate_delta.py \
              --old-db /tmp/st37_work/wellpad_wells_old.db \
              --new-db /tmp/st37_work/wellpad_wells_new.db \
              --output delta_latest.json.gz
          else
            echo "Notice: No previous release asset found. Creating empty delta placeholder."
            echo "{}" | gzip > delta_latest.json.gz
          fi

          # Update manifest.json with release metadata
          NEW_DATE=$(date +%Y-%m-%d)
          NEW_VERSION=$(date +%Y%m01)
          DELTA_SIZE=$(wc -c < delta_latest.json.gz)
          DELTA_SHA=$(sha256sum delta_latest.json.gz | cut -d ' ' -f 1)

          cat <<EOF > manifest.json
          {
            "schema_version": 1,
            "latest_db_version": ${NEW_VERSION},
            "release_date": "${NEW_DATE}",
            "total_wells": ${WELL_COUNT},
            "delta_url": "https://raw.githubusercontent.com/caddie23/wellpad-data/main/delta_latest.json.gz",
            "delta_from_version": 20260901,
            "delta_sha256": "${DELTA_SHA}",
            "delta_size_bytes": ${DELTA_SIZE}
          }
          EOF

          # Commit & Push manifest + delta to main branch
          git config --global user.name "WellPad Sync Bot"
          git config --global user.email "bot@wellpad.ca"
          git add manifest.json delta_latest.json.gz scripts/st37_probe_state.json scripts/st37_release_history.json
          git commit -m "chore(wells): update AER ST37 registry to ${NEW_VERSION} [skip ci]" || echo "No changes to commit"
          git push origin main

          # Create GitHub Release with full database for archival and future delta baselines
          gh release create "v${NEW_VERSION}" /tmp/st37_work/wellpad_wells.db.gzip \
            --title "AER ST37 Well Database v${NEW_VERSION}" \
            --notes "Automated monthly release of AER ST37 Well Registry (${WELL_COUNT} wells). Delta published to delta_latest.json.gz." \
            --repo caddie23/wellpad-data || echo "Release already exists or skipped"
