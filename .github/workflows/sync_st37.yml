name: AER ST37 Automated Sync & Delta Pipeline

on:
  schedule:
    # Run daily at 13:15 UTC (7:15 AM Alberta Mountain Time)
    - cron: '15 13 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force full database rebuild and delta generation'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Data Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install pandas openpyxl requests

      - name: Probe AER for Monthly Release
        id: probe
        run: |
          set +e
          python scripts/probe_st37.py
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "AER ST37 update detected!"
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No update from AER today."
          else
            echo "Probe exited with unexpected error code: $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Process ST37 Update & Generate Delta
        if: steps.probe.outputs.changed == 'true' || inputs.force_build == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/st37_work deltas

          PREV_VERSION=$(python -c "import json; print(json.load(open('manifest.json'))['latest_db_version'])")
          NEW_VERSION=$(date +%Y%m01)
          NEW_DATE=$(date +%Y-%m-%d)
          echo "Previous registry version: ${PREV_VERSION}, new version: ${NEW_VERSION}"

          echo "Building new SQLite database from AER ST37 Excel..."
          python scripts/build_wells_db.py \
            --remote \
            --output-db /tmp/st37_work/wellpad_wells_new.db

          # Count wells
          WELL_COUNT=$(python -c "import sqlite3; con=sqlite3.connect('/tmp/st37_work/wellpad_wells_new.db'); print(con.execute('SELECT COUNT(*) FROM lease_wells').fetchone()[0])")
          echo "Total wells indexed: ${WELL_COUNT}"

          # Compress new database
          gzip -c -9 -n /tmp/st37_work/wellpad_wells_new.db > /tmp/st37_work/wellpad_wells.db.gzip

          # The delta must be computed against exactly the database apps on PREV_VERSION have,
          # i.e. the v${PREV_VERSION} release asset
          DELTA_ARGS=""
          if [ "${NEW_VERSION}" -gt "${PREV_VERSION}" ] && \
             gh release download "v${PREV_VERSION}" --pattern "wellpad_wells.db.gzip" \
               --repo caddie23/wellpad-data --dir /tmp/st37_work/old_release/; then
            echo "Computing delta ${PREV_VERSION} -> ${NEW_VERSION}..."
            gunzip -c /tmp/st37_work/old_release/wellpad_wells.db.gzip > /tmp/st37_work/wellpad_wells_old.db
            DELTA_PATH="deltas/delta_${PREV_VERSION}_${NEW_VERSION}.json.gz"
            python scripts/generate_delta.py \
              --old-db /tmp/st37_work/wellpad_wells_old.db \
              --new-db /tmp/st37_work/wellpad_wells_new.db \
              --output "${DELTA_PATH}"
            # Legacy path read by app builds before manifest schema 2
            cp "${DELTA_PATH}" delta_latest.json.gz
            DELTA_ARGS="--delta ${DELTA_PATH} --delta-from ${PREV_VERSION}"
          else
            echo "Notice: no delta for this run (same version rebuild or no v${PREV_VERSION} release). Apps will use the full database."
          fi

          # Publish the full database first, so the manifest never points at a missing file
          if gh release view "v${NEW_VERSION}" --repo caddie23/wellpad-data > /dev/null 2>&1; then
            gh release upload "v${NEW_VERSION}" /tmp/st37_work/wellpad_wells.db.gzip \
              --clobber --repo caddie23/wellpad-data
          else
            gh release create "v${NEW_VERSION}" /tmp/st37_work/wellpad_wells.db.gzip \
              --title "AER ST37 Well Database v${NEW_VERSION}" \
              --notes "Automated monthly release of AER ST37 Well Registry (${WELL_COUNT} wells)." \
              --repo caddie23/wellpad-data
          fi

          # Update manifest.json (appends the delta to the chain and points full_db at the release)
          python scripts/update_manifest.py \
            --new-version "${NEW_VERSION}" \
            --release-date "${NEW_DATE}" \
            --total-wells "${WELL_COUNT}" \
            --full-db /tmp/st37_work/wellpad_wells.db.gzip \
            ${DELTA_ARGS}

          # Commit & Push manifest + deltas to main branch
          git config --global user.name "WellPad Sync Bot"
          git config --global user.email "bot@wellpad.ca"
          git add manifest.json delta_latest.json.gz deltas scripts/st37_probe_state.json scripts/st37_release_history.json
          git commit -m "chore(wells): update AER ST37 registry to ${NEW_VERSION} [skip ci]" || echo "No changes to commit"
          git push origin main
